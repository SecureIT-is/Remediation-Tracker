      caveat: sanitizeString(iss.caveat || ''),
      nessus_solution: sanitizeString(iss.nessus_solution || ''),
      tasks: tasks
    };
  });

  const machines = raw.machines.map((m, idx) => {
    if (!m || typeof m !== 'object') throw new Error('Machine ' + idx + ' is not an object');
    return {
      slug: sanitizeString(m.slug),
      ips: Array.isArray(m.ips) ? m.ips.map(sanitizeString) : [],
      name: sanitizeString(m.name || ''),
      os: sanitizeString(m.os || 'Unknown'),
      type: sanitizeString(m.type || ''),
      klass: sanitizeString(m.klass || 'Workstation'),
      subnet: sanitizeString(m.subnet || ''),
      tasks: Array.isArray(m.tasks) ? m.tasks.map(sanitizeString) : []
    };
  });

  return { meta: meta, issues: issues, machines: machines };
}

function sanitizeChecked(raw) {
  if (!raw || typeof raw !== 'object') return {};
  const clean = {};
  Object.keys(raw).forEach(function(k) {
    if (typeof k === 'string' && /^issue_[A-Za-z0-9]{8}::host_[A-Za-z0-9]{8}::\d+$/.test(k) && raw[k] === 1) {
      clean[k] = 1;
    }
  });
  return clean;
}

// --- Session persistence ---
function saveSession() {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      type: 'secureit-remediation-tracker', version: 1,
      scanName: SCAN_NAME, data: DATA, checked: checked
    }));
  } catch(e) {}
}
function loadSession() {
  try {
    const raw = JSON.parse(localStorage.getItem(SESSION_KEY));
    if (raw && raw.data && raw.type === 'secureit-remediation-tracker') return raw;
  } catch(e) {}
  return null;
}

function saveState() {
  saveSession();
  saveDirty = true;
  updateSaveButton();
}

function getAllTaskIds() {
  const ids = new Set();
  if (DATA) DATA.issues.forEach(iss => iss.tasks.forEach(t => ids.add(t.id)));
  return ids;
}

function isChecked(id) { return !!checked[id]; }
function setChecked(id, val) {
  if (val) checked[id] = 1; else delete checked[id];
  saveState();
}

// --- Save button state ---
function updateSaveButton() {
  const btn = document.getElementById('saveBtn');

  btn.classList.toggle('dirty', saveDirty);
}

// --- Modal helpers ---
function showStartupModal() {

function showConfirmModal(data, checkedState) {

  const taskCount = data.issues.reduce(function(s, i) { return s + i.tasks.length; }, 0);

function cancelLoad() {

function confirmLoad() {

// --- File save/load ---
function saveToFile() {
  const payload = JSON.stringify({
    type: 'secureit-remediation-tracker', version: 1,
    scanName: SCAN_NAME, data: DATA, checked: checked
  }, null, 2);
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = SCAN_NAME.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-remediation.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  saveDirty = false;
  updateSaveButton();
}

function pickJsonFile() {
  document.getElementById('fileInput').click();
}

function handleFileLoad(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const raw = JSON.parse(e.target.result);
      var cleanData, cleanChecked = null;

      if (raw.type === 'secureit-remediation-tracker' && raw.data) {
        cleanData = sanitizeData(raw.data);
        if (raw.checked) cleanChecked = sanitizeChecked(raw.checked);
      } else if (raw.meta && raw.issues && raw.machines) {
        cleanData = sanitizeData(raw);
      } else {
        throw new Error('Unrecognized file format. Expected a remediation tracker export or raw data JSON.');
      }

      showConfirmModal(cleanData, cleanChecked);
    } catch(err) {
      alert('Failed to load file: ' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function loadInitialData() {
  try {
    const clean = sanitizeData(INITIAL_DATA);
    document.getElementById('startupModal').classList.add('hidden');
    initWithData(clean, null);
    saveSession();
  } catch(err) {
    alert('Initial data failed validation: ' + err.message);
  }
}

function clearData() {

}
function confirmClear() {
  document.getElementById('clearModal').classList.add('hidden');

  DATA = null;
  CHECKED = {};
  document.getElementById('issuesView').innerHTML = '';

}

// --- Initialize with data ---
function initWithData(data, checkedState) {
  DATA = data;
  SCAN_NAME = DATA.meta.scan || 'Untitled';
  ALL_TASK_IDS = getAllTaskIds();

  WORKSTREAM_MAP = {};
  DATA.issues.forEach(function(iss) {
    var key = 'ig-' + iss.workstream.replace(/\W+/g, '-');
    if (!WORKSTREAM_MAP[key]) WORKSTREAM_MAP[key] = [];
    WORKSTREAM_MAP[key].push(iss);
  });

  if (checkedState && typeof checkedState === 'object') {
    checked = {};
    Object.keys(checkedState).forEach(function(k) {
      if (ALL_TASK_IDS.has(k)) checked[k] = 1;
    });
  } else {
    checked = {};
  }

  saveDirty = false;
  updateSaveButton();
  saveSession();
  updateHeaderMeta();

  document.querySelector('.sticky-nav').classList.remove('ui-hidden');
  document.querySelector('.content').classList.remove('ui-hidden');
  document.getElementById('toolbar').classList.remove('ui-hidden');
  document.getElementById('startupModal').classList.add('hidden');
  document.getElementById('confirmModal').classList.add('hidden');

  refreshAll();
}

function esc(s) {

function sevFromScore(score) {
  if (score >= 9.0) return 'high';
  if (score >= 8.5) return 'med';
  return 'low';
}

}
function expandSvg() {

}

      html += '<span>' + iss.tasks.length + ' host' + (iss.tasks.length !== 1 ? 's' : '') + '</span>';
      html += '<span>' + esc(iss.family) + '</span>';

      html += '</div></div>';
      html += '<div class="issue-badges">';

      if (iss.kev) html += '<span class="badge badge-kev">CISA KEV</span>';

      html += '<button class="issue-expand-btn" onclick="toggleDetail(\'' + detailId + '\')" aria-label="Expand remediation details">' + expandSvg() + '</button>';

        html += '<input type="checkbox" ' + (isDone ? 'checked' : '') +

        const mSlug = m ? m.slug : '';

      }
      html += '</div>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  if (!html) html = '<div class="empty-state">No issues match your filter.</div>';
  document.getElementById('issuesView').innerHTML = html;
}

function renderMachines() {

    html += '<div class="group" id="' + grpId + '">';

    html += '</div></div>';
  });

  if (!html) html = '<div class="empty-state">No machines match your filter.</div>';

}

function matchesSearch(iss, machine) {
  if (!searchTerm && !filterUndone) return true;
  if (filterUndone && iss.tasks.every(t => isChecked(t.id))) return false;
  if (!searchTerm) return true;
  const q = searchTerm.toLowerCase();
  if (iss.name.toLowerCase().includes(q)) return true;
  if (iss.pid.includes(q)) return true;
  if (iss.family.toLowerCase().includes(q)) return true;
  if (iss.cves.some(c => c.toLowerCase().includes(q))) return true;
  if (iss.tasks.some(t => {
    const m = DATA.machines.find(mm => mm.slug === t.machine);
    return m && (m.ips.some(ip => ip.includes(q)) || (m.name && m.name.toLowerCase().includes(q)));
  })) return true;
  return false;
}
function matchesSearchMachine(m) {
  if (filterUndone && m.tasks.every(t => isChecked(t))) return false;
  if (!searchTerm) return true;
  const q = searchTerm.toLowerCase();
  if (m.ips.some(ip => ip.includes(q))) return true;
  if (m.name && m.name.toLowerCase().includes(q)) return true;
  if (m.os.toLowerCase().includes(q)) return true;
  if (m.subnet.includes(q)) return true;
  if (m.tasks.some(tid => {
    const issSlug = tid.split('::')[0];
    const iss = DATA.issues.find(i => i.slug === issSlug);
    return iss && iss.name.toLowerCase().includes(q);
  })) return true;
  return false;
}

function toggleTask(tid, val) {
  setChecked(tid, val);
  refreshAll();
}
function toggleIssue(pid, val) {
  const iss = DATA.issues.find(i => i.pid === pid);
  if (!iss) return;
  iss.tasks.forEach(t => setChecked(t.id, val));
  refreshAll();
}
function checkGroup(grpId, val) {
  const issues = WORKSTREAM_MAP[grpId];
  if (issues) issues.forEach(iss => iss.tasks.forEach(t => setChecked(t.id, val)));
  refreshAll();
}
function checkMachineGroup(grpId, val) {
  const klass = grpId.replace('mg-', '');
  DATA.machines.forEach(m => {
    if (m.klass === klass) m.tasks.forEach(t => setChecked(t, val));
  });
  refreshAll();
}
function checkMachine(slug, val) {
  const m = DATA.machines.find(mm => mm.slug === slug);
  if (m) m.tasks.forEach(t => setChecked(t, val));
  refreshAll();
}

function toggleGroup(grpId) {
  document.getElementById(grpId)?.classList.toggle('collapsed');
}
function toggleMachineGroup(grpId, slug) {
  const el = document.getElementById(grpId);
  if (!el) return;
  const wasCollapsed = el.classList.contains('collapsed');
  el.classList.toggle('collapsed');
  if (wasCollapsed) {
    const body = el.querySelector('[data-gbody]');
    if (body && !body.dataset.rendered) {
      body.dataset.rendered = '1';
      renderMachineBody(body, slug);
    }

}
function renderMachineBody(body, slug) {
  const m = DATA.machines.find(mm => mm.slug === slug);
  if (!m) return;
  let html = '<div class="machine-os">' + esc(m.os) + (m.ips.length ? ' &mdash; ' + m.ips.map(esc).join(', ') : '') + '</div>';

    const iss = DATA.issues.find(i => i.slug === issSlug);

    html += '</div>';
    html += '<div class="issue-badges">';

    if (iss.kev) html += '<span class="badge badge-kev" style="font-size:9px">KEV</span>';
    html += '</div></div>';
  });
  body.innerHTML = html;
}
function toggleDetail(detId) {
  const pid = detId.replace('det-', '');

  document.getElementById(detId)?.classList.toggle('open');

function toggleHosts(pid) {

function switchView(view) {
  activeView = view;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  document.querySelectorAll('.view-panel').forEach(p => p.classList.toggle('active', p.id === view + 'View'));

const NAV_STACK = [];
const NAV_MAX = 10;
function navPush(view, scrollTarget) {
  NAV_STACK.push({ view: activeView, scrollY: window.scrollY });
  if (NAV_STACK.length > NAV_MAX) NAV_STACK.shift();
  document.getElementById('navBack').classList.add('visible');
}
function navGoBack() {
  if (!NAV_STACK.length) return;
  const entry = NAV_STACK.pop();
  switchView(entry.view);
  requestAnimationFrame(() => window.scrollTo(0, entry.scrollY));
  if (!NAV_STACK.length) document.getElementById('navBack').classList.remove('visible');
}
function navToMachine(slug) {
  navPush();
  switchView('machines');
  refreshAll();
  requestAnimationFrame(() => {
    const el = document.getElementById('msub-' + slug);
    if (!el) return;
    const grp = el.closest('.group');
    if (grp && grp.classList.contains('collapsed')) {
      grp.classList.remove('collapsed');
    }
    if (el.classList.contains('collapsed')) {
      toggleMachineGroup('msub-' + slug, slug);
    }
    requestAnimationFrame(() => {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.style.outline = '2px solid var(--gold)';
      setTimeout(() => { el.style.outline = ''; }, 1500);
    });
  });
}
function navToIssue(issueSlug) {
  const iss = DATA.issues.find(i => i.slug === issueSlug);
  if (!iss) return;
  navPush();
  openHostPanels.add(iss.pid);
  switchView('issues');
  refreshAll();
  requestAnimationFrame(() => {
    const card = document.querySelector('.issue-card[data-pid="' + iss.pid + '"]');
    if (!card) return;
    const grp = card.closest('.group');
    if (grp && grp.classList.contains('collapsed')) grp.classList.remove('collapsed');
    requestAnimationFrame(() => {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.style.outline = '2px solid var(--gold)';
      setTimeout(() => { card.style.outline = ''; }, 1500);
    });
  });
}

function toggleUndoneFilter() {
  filterUndone = !filterUndone;
  document.getElementById('filterUndone').classList.toggle('active', filterUndone);
  refreshAll();
}

function updateGlobalProgress() {
  const total = ALL_TASK_IDS.size;
  let done = 0;
  ALL_TASK_IDS.forEach(id => { if (isChecked(id)) done++; });
  const pct = total ? (done / total * 100) : 0;
  document.getElementById('globalFill').style.width = pct + '%';
  document.getElementById('globalLabel').textContent = done + ' / ' + total + ' (' + Math.round(pct) + '%)';
}

function updateHeaderMeta() {
  const m = DATA.meta;
  const issueCount = DATA.issues.length;
  const machineCount = DATA.machines.length;
  const taskCount = DATA.issues.reduce((sum, iss) => sum + iss.tasks.length, 0);
  document.getElementById('headerTitle').textContent = SCAN_NAME + ' Remediation Tracker';
  document.title = SCAN_NAME + ' Remediation Tracker';
  document.getElementById('headerMeta').innerHTML =
    '<span>Scan: ' + esc(m.scan_date) + '</span>' +
    '<span>' + issueCount + ' issues</span>' +
    '<span>' + machineCount + ' machines</span>' +
    '<span>' + taskCount + ' tasks</span>';
}

function refreshAll() {
  if (!DATA) return;
  renderIssues();
  renderMachines();
  updateGlobalProgress();
}

// --- Startup ---
document.getElementById('fileInput').addEventListener('change', handleFileLoad);

let searchTimeout;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchTerm = this.value.trim();
    if (DATA) refreshAll();
  }, 200);
});

const session = loadSession();
if (session) {
  try {
    const clean = sanitizeData(session.data);
    const cleanChecked = session.checked ? sanitizeChecked(session.checked) : null;
    initWithData(clean, cleanChecked);
  } catch(e) {
    localStorage.removeItem(SESSION_KEY);
    showStartupModal();
  }
} else {
  showStartupModal();
}

function toggleSettingsModal() {
  var m = document.getElementById('settingsModal');
  m.classList.toggle('hidden');
  if (!m.classList.contains('hidden')) syncThemePills();
}
function closeSettingsModal() {
  document.getElementById('settingsModal').classList.add('hidden');
}
function syncThemePills() {
  var current = document.documentElement.getAttribute('data-theme') || 'system';
  document.querySelectorAll('.theme-pill').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-theme-val') === current);
  });
}
function setTheme(val) {
  if (val === 'system') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', val);
  }
  try { localStorage.setItem('secureit-rem-theme', val); } catch(e) {}
  syncThemePills();
}
(function() {
  try {
    var saved = localStorage.getItem('secureit-rem-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch(e) {}
})();
</script>
