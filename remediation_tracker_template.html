<title>Remediation Tracker</title>
<style>
:root {
  --navy: #2D3E52;
  --navy-deep: #243041;
  --gold: #D5A754;
  --gold-dark: #B8893C;
  --body-text: #1A1A1A;

  --border-subtle: #E8ECF0;
  --sev-low: #2B6CB0;
  --sev-med: #C05621;
  --sev-high: #9B2C2C;
  --sev-low-bg: #EBF4FF;
  --sev-med-bg: #FFF5EB;
  --sev-high-bg: #FFF5F5;

}

  :root:not([data-theme="light"]) {
    --navy: #8BA4C0;
    --navy-deep: #0F1A26;
    --gold: #D5A754;
    --gold-dark: #E0BD78;
    --body-text: #E2E8F0;
    --gray-mid: #A0AEC0;
    --gray-light: #4A5568;
    --gray-bg: #1A2535;
    --surface: #162030;
    --surface-alt: #1E2D40;
    --surface-raised: #243041;
    --border: #3A4D63;
    --border-subtle: #2D3E52;
    --sev-low: #63B3ED;
    --sev-med: #F6AD55;
    --sev-high: #FC8181;
    --sev-low-bg: #1A2E4A;
    --sev-med-bg: #3D2B1A;
    --sev-high-bg: #3D1A1A;
    --progress-track: #2D3E52;
    --progress-fill: #D5A754;
    --check-accent: #D5A754;
    --kev-bg: #3D1A1A;
    --kev-border: #9B2C2C;
    --kev-text: #FC8181;
    --expand-bg: #1A2535;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
  }
}
:root[data-theme="dark"] {
  --navy: #8BA4C0;
  --navy-deep: #0F1A26;
  --gold: #D5A754;
  --gold-dark: #E0BD78;
  --body-text: #E2E8F0;
  --gray-mid: #A0AEC0;
  --gray-light: #4A5568;
  --gray-bg: #1A2535;
  --surface: #162030;
  --surface-alt: #1E2D40;
  --surface-raised: #243041;
  --border: #3A4D63;
  --border-subtle: #2D3E52;
  --sev-low: #63B3ED;
  --sev-med: #F6AD55;
  --sev-high: #FC8181;
  --sev-low-bg: #1A2E4A;
  --sev-med-bg: #3D2B1A;
  --sev-high-bg: #3D1A1A;
  --progress-track: #2D3E52;
  --progress-fill: #D5A754;
  --check-accent: #D5A754;
  --kev-bg: #3D1A1A;
  --kev-border: #9B2C2C;
  --kev-text: #FC8181;
  --expand-bg: #1A2535;

  --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: Arial, Helvetica, sans-serif;
  color: var(--body-text);
  background: var(--surface);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

.app-header {
  background: var(--surface-raised);
  border-bottom: 2px solid var(--gold);
  padding: 16px 24px 12px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: var(--shadow-lg);
}
.header-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header-logo {
  height: 28px; opacity: 0.9; display: flex; align-items: center;
}
.header-logo .logo-main { fill: #2D3E52; }
.header-logo .logo-accent { fill: #D5A754; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .header-logo .logo-main { fill: #FFFFFF; }
}
:root[data-theme="dark"] .header-logo .logo-main { fill: #FFFFFF; }
.header-title { font-size: 18px; font-weight: 700; color: var(--navy); letter-spacing: 0.02em; }
.header-meta {
  display: flex; gap: 20px; margin-top: 8px; font-size: 12px; color: var(--gray-mid);
  font-variant-numeric: tabular-nums;
}
.header-meta span::before { content: ''; display: inline-block; width: 6px; height: 6px;
  background: var(--gold); margin-right: 6px; vertical-align: middle; }
.header-meta span.eff-low::before { background: var(--sev-low); }
.header-meta span.eff-med::before { background: var(--sev-med); }
.header-meta span.eff-high::before { background: var(--sev-high); }

.progress-wrap { margin-top: 10px; display: flex; align-items: center; gap: 12px; }
.progress-bar { flex: 1; height: 6px; background: var(--progress-track); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--progress-fill); border-radius: 3px;
  transition: width 0.3s ease; }
.progress-label { font-size: 13px; font-weight: 700; color: var(--gold-dark);
  font-variant-numeric: tabular-nums; min-width: 90px; text-align: right; }

.sticky-nav {
  padding-bottom: 12px;
}
.tab-bar {
  display: flex; gap: 0; margin: 0 24px; border-bottom: 1px solid var(--border); align-items: stretch;
}
.nav-back {
  display: flex; align-items: center; justify-content: center; width: 32px;
  background: none; border: none; cursor: pointer; color: var(--gray-mid);
  padding: 0; margin-right: 4px; border-bottom: 3px solid transparent; flex-shrink: 0;
  visibility: hidden;
}
.nav-back:hover { color: var(--navy); }
.nav-back.visible { visibility: visible; }
.nav-back svg { width: 16px; height: 16px; }
.undo-btn {
  display: flex; align-items: center; justify-content: center; width: 28px;
  background: none; border: none; cursor: pointer; color: var(--gray-mid);
  padding: 0; border-bottom: 3px solid transparent; flex-shrink: 0;
}
.undo-btn:hover:not(.disabled) { color: var(--navy); }
.undo-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }
.tab-btn {
  padding: 12px 24px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--gray-mid); background: none; border: none;
  border-bottom: 3px solid transparent; cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--navy); }
.tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); }
.tab-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.sort-btn {
  padding: 6px 10px; font-size: 11px; font-weight: 600;
  color: var(--gray-mid); background: none; border: 1px solid var(--border);
  border-radius: 3px; cursor: pointer; align-self: center; white-space: nowrap;
  letter-spacing: 0.02em; margin-left: 8px;
}
.sort-btn:hover { border-color: var(--navy); color: var(--navy); }
.toggle-completed {
  margin-left: auto; padding: 6px 12px; font-size: 11px; font-weight: 600;
  color: var(--gray-mid); background: none; border: 1px solid var(--border);
  border-radius: 3px; cursor: pointer; align-self: center; white-space: nowrap;
  letter-spacing: 0.02em;
}
.toggle-completed:hover { border-color: var(--navy); color: var(--navy); }
.toggle-completed.active { background: var(--navy); color: #fff; border-color: var(--navy); }

.search-bar {
  margin: 12px 24px 0; display: flex; gap: 8px; align-items: center;
}
.search-input {
  flex: 1; padding: 8px 12px; font-size: 13px; font-family: inherit;
  background: var(--surface-alt); color: var(--body-text);
  border: 1px solid var(--border); border-radius: 4px;
}
.search-input::placeholder { color: var(--gray-mid); }
.search-input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(213,167,84,0.2); }

.splash-overlay {
  position: fixed; inset: 0; z-index: 300;
  display: none; align-items: center; justify-content: center; flex-direction: column;
  background: rgba(0,0,0,0.75); opacity: 0; transition: opacity 0.6s ease;
  pointer-events: none;
}
.splash-overlay.active { display: flex; opacity: 1; pointer-events: auto; }
.splash-overlay canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.splash-content {
  position: relative; z-index: 1; text-align: center; color: #fff;
  animation: splash-in 0.8s ease-out both;
}
@keyframes splash-in {
  0% { transform: scale(0.5) translateY(30px); opacity: 0; }
  60% { transform: scale(1.05) translateY(-5px); opacity: 1; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
.splash-shield {
  width: 80px; height: 80px; margin: 0 auto 16px;
  background: var(--gold); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 40px rgba(213,167,84,0.6), 0 0 80px rgba(213,167,84,0.3);
  animation: shield-glow 2s ease-in-out infinite;
}
@keyframes shield-glow {
  0%,100% { box-shadow: 0 0 40px rgba(213,167,84,0.6), 0 0 80px rgba(213,167,84,0.3); }
  50% { box-shadow: 0 0 60px rgba(213,167,84,0.8), 0 0 120px rgba(213,167,84,0.5); }
}
.splash-shield svg { width: 44px; height: 44px; }
.splash-title {
  font-size: 28px; font-weight: 700; color: var(--gold);
  margin-bottom: 8px; letter-spacing: 0.02em;
}
.splash-sub { font-size: 14px; color: rgba(255,255,255,0.8); margin-bottom: 24px; }
.splash-dismiss {
  padding: 10px 28px; font-size: 13px; font-weight: 700; font-family: inherit;
  background: var(--gold); color: var(--navy); border: none; border-radius: 4px;
  cursor: pointer; letter-spacing: 0.03em;
}
.splash-dismiss:hover { background: #e0b65e; }

.content { padding: 16px 24px 80px; }
.view-panel { display: none; }
.view-panel.active { display: block; }

.group { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 6px;
  overflow: hidden; background: var(--surface-raised); box-shadow: var(--shadow); scroll-margin-top: 200px; }
.group-header {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  background: var(--surface-alt); cursor: pointer; user-select: none;
  border-bottom: 1px solid var(--border-subtle);
}
.group-header:hover { background: var(--surface-raised); }
.group-header:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.group-chevron {
  width: 18px; height: 18px; color: var(--gray-mid); flex-shrink: 0;
  transition: transform 0.2s;
}
.group.collapsed .group-chevron { transform: rotate(-90deg); }
.group.collapsed .group-body { display: none; }
.group-title { font-size: 13px; font-weight: 700; color: var(--navy); flex: 1; }
.group-count {
  font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px;
  background: var(--navy); color: #fff; font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}
.group-progress {
  width: 60px; height: 4px; background: var(--progress-track); border-radius: 2px;
  overflow: hidden; flex-shrink: 0;
}
.group-progress-fill { height: 100%; background: var(--progress-fill); border-radius: 2px;
  transition: width 0.3s; }
.group-actions { display: flex; gap: 4px; }
.group-action {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 3px;
  background: none; border: 1px solid var(--border); color: var(--gray-mid);
  cursor: pointer; font-family: inherit; text-transform: uppercase; letter-spacing: 0.04em;
}
.group-action:hover { border-color: var(--gold); color: var(--gold-dark); }
.group-action:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

.issue-card { border-bottom: 1px solid var(--border-subtle); scroll-margin-top: 200px; }
.issue-card:last-child { border-bottom: none; }
.issue-row {
  display: grid;
  grid-template-columns: 32px 4px 1fr auto;
  align-items: start; gap: 0 10px; padding: 8px 14px; min-height: 42px;
}
.issue-row:hover { background: var(--expand-bg); }
.issue-cb { margin-top: 2px; }
.issue-cb input[type="checkbox"] {
  width: 16px; height: 16px; accent-color: var(--check-accent); cursor: pointer;
}
.sev-stripe { width: 4px; border-radius: 2px; align-self: stretch; }
.sev-stripe.low { background: var(--sev-low); }
.sev-stripe.med { background: var(--sev-med); }
.sev-stripe.high { background: var(--sev-high); }
.issue-info { min-width: 0; }
.issue-name {
  font-size: 13px; font-weight: 600; color: var(--body-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.issue-name.done { text-decoration: line-through; opacity: 0.5; }
.issue-sub { font-size: 11px; color: var(--gray-mid); margin-top: 2px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.issue-badges { display: flex; gap: 6px; align-items: center; flex-shrink: 0; margin-left: 8px; }
.badge {
  font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 3px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.badge-score { background: var(--surface-alt); color: var(--navy); border: 1px solid var(--border); }
.badge-kev { background: var(--kev-bg); color: var(--kev-text); border: 1px solid var(--kev-border); }
.badge-exploit { background: var(--sev-med-bg); color: var(--sev-med); border: 1px solid var(--sev-med); }
.badge-effort-low { background: var(--sev-low-bg); color: var(--sev-low); }
.badge-effort-med { background: var(--sev-med-bg); color: var(--sev-med); }
.badge-effort-high { background: var(--sev-high-bg); color: var(--sev-high); }
.badge-count { background: var(--gold); color: #fff; font-size: 10px; }

.issue-expand-btn {
  background: none; border: none; cursor: pointer; color: var(--gray-mid);
  padding: 4px; border-radius: 3px; display: flex; align-items: center;
}
.issue-expand-btn:hover { color: var(--navy); background: var(--surface-alt); }
.issue-expand-btn:focus-visible { outline: 2px solid var(--gold); }
.issue-detail {
  display: none; padding: 8px 14px 12px 46px; font-size: 12px;
  background: var(--expand-bg); border-top: 1px solid var(--border-subtle);
  color: var(--gray-mid); line-height: 1.5;
}
.issue-detail.open { display: block; }

.hosts-toggle {
  display: flex; align-items: center; gap: 6px; padding: 6px 14px 6px 46px;
  cursor: pointer; font-size: 12px; font-weight: 600; color: var(--gold-dark);
  background: var(--surface-raised); border-top: 1px solid var(--border-subtle);
  user-select: none;
}
.hosts-toggle:hover { background: var(--expand-bg); color: var(--navy); }
.hosts-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: -2px; }
.hosts-toggle .ht-chevron {
  display: inline-block; font-size: 10px; transition: transform 0.15s; margin-right: 2px;
}
.hosts-toggle.open .ht-chevron { transform: rotate(90deg); }
.hosts-panel {
  display: none; padding: 6px 14px 10px 46px;
  background: var(--expand-bg); border-top: 1px solid var(--border-subtle);
}
.hosts-panel.open { display: block; }
.host-row {
  display: flex; align-items: center; gap: 8px; padding: 4px 0;
  font-size: 12px; border-bottom: 1px solid var(--border-subtle);
}
.host-row:last-child { border-bottom: none; }
.host-row input[type="checkbox"] { width: 14px; height: 14px; accent-color: var(--check-accent); cursor: pointer; flex-shrink: 0; }
.host-row-name { color: var(--body-text); min-width: 0; }
.host-row-name.done { text-decoration: line-through; opacity: 0.5; }
.host-row-ip { color: var(--gray-mid); font-size: 11px; font-variant-numeric: tabular-nums; }
.host-row-link { cursor: pointer; border-radius: 3px; padding: 1px 3px; margin: -1px -3px; }
.host-row-link:hover { background: var(--gold); color: #fff; }
.rem-notes {
  display: block; width: calc(100% - 22px); margin: 2px 0 4px 22px; padding: 4px 6px;
  font-size: 11px; font-family: inherit; color: var(--body-text); background: var(--surface-alt);
  border: 1px solid var(--border); border-radius: 3px; resize: vertical; max-height: 80px;
  line-height: 1.3;
}
.rem-notes:focus { border-color: var(--gold); outline: none; }
.host-row-output {
  font-size: 10px; font-family: monospace; color: var(--gray-mid);
  padding: 2px 0 6px 22px; word-break: break-all; line-height: 1.4;
  border-bottom: 1px solid var(--border-subtle);
}
.detail-hdr { font-weight: 700; margin-top: 6px; color: var(--gray-mid); }
.detail-hdr:first-child { margin-top: 0; }
.detail-line { margin: 1px 0; word-break: break-word; }
.detail-indent { padding-left: 12px; }
.detail-sep { border: none; border-top: 1px solid var(--border-subtle); margin: 4px 0; }
.detail-label { font-weight: 700; color: var(--navy); text-transform: uppercase;
  letter-spacing: 0.04em; font-size: 10px; margin-top: 8px; }
.detail-label:first-child { margin-top: 0; }
.detail-text { margin-top: 2px; color: var(--body-text); }
.detail-caveat { margin-top: 4px; padding: 6px 10px; background: var(--kev-bg);
  border-left: 3px solid var(--kev-border); border-radius: 0 3px 3px 0; color: var(--kev-text); font-size: 11px; }
.detail-hosts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.host-chip {
  font-size: 10px; padding: 2px 6px; background: var(--surface-alt);
  border: 1px solid var(--border); border-radius: 3px; font-variant-numeric: tabular-nums;
  color: var(--body-text);
}

.machine-task {
  display: grid; grid-template-columns: 32px 4px 1fr auto;
  align-items: center; gap: 0 10px; padding: 6px 14px; min-height: 36px;
  border-bottom: 1px solid var(--border-subtle);
}
.machine-task:last-child { border-bottom: none; }
.machine-task:hover { background: var(--expand-bg); }
.mt-name { font-size: 12px; color: var(--body-text); min-width: 0; cursor: pointer;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt-name.done { text-decoration: line-through; opacity: 0.5; }
.mt-name:hover { color: var(--gold); }
.mt-detail { font-size: 10px; color: var(--gray-mid); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.machine-os { font-size: 11px; color: var(--gray-mid); padding: 2px 14px;
  background: var(--surface-alt); border-bottom: 1px solid var(--border-subtle); }

.empty-state { text-align: center; padding: 48px 24px; color: var(--gray-mid); font-size: 14px; }

.toolbar { display: flex; gap: 8px; margin-left: auto; align-items: center; }
.toolbar-group { display: flex; gap: 8px; }
.toolbar-spacer { width: 12px; }
.btn-clear { background: var(--surface-alt); color: var(--gray-mid); }
.btn-clear:hover { border-color: #9B2C2C; color: #9B2C2C; }
.toolbar-btn {
  padding: 4px 14px; font-size: 11px; font-weight: 700; font-family: inherit;
  border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
  text-transform: uppercase; letter-spacing: 0.04em;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.toolbar-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.btn-save { background: #276749; color: #fff; border-color: #276749; }
.btn-save:hover { background: #22543D; border-color: #22543D; }
.btn-save.dirty { background: #9B2C2C; border-color: #9B2C2C; animation: pulse-save 1.5s ease-in-out 1; }
.btn-save.dirty:hover { background: #822727; border-color: #822727; }
@keyframes pulse-save { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center; z-index: 200;
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--surface-raised); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: var(--shadow-lg); padding: 32px;
  max-width: 440px; width: 90%;
}
.modal-title { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
.modal-text { font-size: 13px; color: var(--gray-mid); line-height: 1.5; margin-bottom: 20px; }
.modal-warning {
  font-size: 11px; color: var(--kev-text); background: var(--kev-bg);
  border-left: 3px solid var(--kev-border); padding: 8px 12px;
  border-radius: 0 4px 4px 0; margin-bottom: 20px;
}
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.modal-btn {
  padding: 8px 20px; font-size: 13px; font-weight: 700; font-family: inherit;
  border-radius: 4px; cursor: pointer; border: 1px solid var(--border);
}
.modal-btn-primary { background: var(--navy); color: #fff; border-color: var(--navy); }
.modal-btn-primary:hover { opacity: 0.9; }
.modal-btn-secondary { background: var(--surface-alt); color: var(--gray-mid); }
.modal-btn-secondary:hover { border-color: var(--gold); color: var(--navy); }
.modal-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }

.gear-btn {
  background: none; border: none; cursor: pointer; padding: 4px;
  color: var(--gray-mid); display: flex; align-items: center;
  transition: color 0.15s;
}
.gear-btn:hover { color: var(--navy); }
.gear-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.gear-btn svg { width: 20px; height: 20px; }

.theme-pills {

function compareIPs(a, b) {
  var pa = (a || '').split('.').map(Number);
  var pb = (b || '').split('.').map(Number);
  for (var i = 0; i < 4; i++) {
    if ((pa[i] || 0) !== (pb[i] || 0)) return (pa[i] || 0) - (pb[i] || 0);
  }
  return 0;
}

function sortedTasks(tasks) {
  var sorted = tasks.slice();
  sorted.sort(function(a, b) {
    var ma = DATA.machines.find(function(mm) { return mm.slug === a.machine; });
    var mb = DATA.machines.find(function(mm) { return mm.slug === b.machine; });
    if (sortMode === 'ip') {
      return compareIPs(ma ? ma.ips[0] : '', mb ? mb.ips[0] : '');
    }
    var nameA = (ma && ma.name) ? ma.name.toLowerCase() : '';
    var nameB = (mb && mb.name) ? mb.name.toLowerCase() : '';
    return nameA.localeCompare(nameB);
  });
  return sorted;
}

function sortMachines(machines) {
  var sorted = machines.slice();
  sorted.sort(function(a, b) {
    if (sortMode === 'ip') return compareIPs(a.ips[0] || '', b.ips[0] || '');
    return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
  });
  return sorted;
}

// --- Sanitization ---
function sanitizeString(s) {
  if (typeof s !== 'string') return String(s == null ? '' : s);
  return s;
}

function sanitizeData(raw) {
  if (!raw || typeof raw !== 'object') throw new Error('Invalid data: not an object');
  if (!raw.meta || typeof raw.meta !== 'object') throw new Error('Missing or invalid meta');
  if (!Array.isArray(raw.issues)) throw new Error('Missing or invalid issues array');
  if (!Array.isArray(raw.machines)) throw new Error('Missing or invalid machines array');
  var dsv = raw.meta.dataSchemaVersion;
  if (dsv != null && COMPATIBLE_SCHEMA_VERSIONS.indexOf(dsv) === -1) throw new Error('Incompatible data schema version ' + dsv + '. Compatible versions: ' + COMPATIBLE_SCHEMA_VERSIONS.join(', '));

  const meta = {
    scan: sanitizeString(raw.meta.scan),
    scan_date: sanitizeString(raw.meta.scan_date),
    dataSchemaVersion: typeof raw.meta.dataSchemaVersion === 'number' ? raw.meta.dataSchemaVersion : DATA_SCHEMA_VERSION
  };

  const issues = raw.issues.map((iss, idx) => {
    if (!iss || typeof iss !== 'object') throw new Error('Issue ' + idx + ' is not an object');
    if (!Array.isArray(iss.tasks)) throw new Error('Issue ' + idx + ' missing tasks array');
    const tasks = iss.tasks.map(t => {
      if (!t || typeof t !== 'object') return null;
      const id = sanitizeString(t.id);
      if (!/^issue_[A-Za-z0-9]{8}::host_[A-Za-z0-9]{8}::\d+$/.test(id)) throw new Error('Invalid task id format: ' + id);
      return { id: id, machine: sanitizeString(t.machine), detail: sanitizeString(t.detail || '') };
    }).filter(Boolean);
    return {
      slug: sanitizeString(iss.slug),
      pid: sanitizeString(iss.pid),
      name: sanitizeString(iss.name),
      family: sanitizeString(iss.family || ''),
      score: typeof iss.score === 'number' ? iss.score : parseFloat(iss.score) || 0,
      src: sanitizeString(iss.src || 'CVSSv3'),
      sev: typeof iss.sev === 'number' ? Math.floor(iss.sev) : 0,
      kev: iss.kev === true,
      kevdate: sanitizeString(iss.kevdate || ''),
      exploit: iss.exploit === true,
      maturity: sanitizeString(iss.maturity || ''),
      epss: typeof iss.epss === 'number' ? iss.epss : 0,
      cves: Array.isArray(iss.cves) ? iss.cves.map(sanitizeString) : [],
      ports: Array.isArray(iss.ports) ? iss.ports.map(sanitizeString) : [],
      workstream: sanitizeString(iss.workstream || 'Uncategorized'),
      effort: sanitizeString(iss.effort || 'Medium'),
      estimate: sanitizeString(iss.estimate || ''),
      remediation: sanitizeString(iss.remediation || ''),
      caveat: sanitizeString(iss.caveat || ''),
      nessus_solution: sanitizeString(iss.nessus_solution || ''),
      tasks: tasks
    };
  });

  const machines = raw.machines.map((m, idx) => {
    if (!m || typeof m !== 'object') throw new Error('Machine ' + idx + ' is not an object');
    return {
      slug: sanitizeString(m.slug),
      ips: Array.isArray(m.ips) ? m.ips.map(sanitizeString) : [],
      name: sanitizeString(m.name || ''),
      os: sanitizeString(m.os || 'Unknown'),
      type: sanitizeString(m.type || ''),
      klass: sanitizeString(m.klass || 'Workstation'),
      subnet: sanitizeString(m.subnet || ''),
      tasks: Array.isArray(m.tasks) ? m.tasks.map(sanitizeString) : []
    };
  });

  return { meta: meta, issues: issues, machines: machines };
}

function sanitizeChecked(raw) {
  if (!raw || typeof raw !== 'object') return {};
  const clean = {};
  Object.keys(raw).forEach(function(k) {
    if (typeof k === 'string' && /^issue_[A-Za-z0-9]{8}::host_[A-Za-z0-9]{8}::\d+$/.test(k) && raw[k] === 1) {
      clean[k] = 1;
    }
  });
  return clean;
}

function saveSession() {

    }));

function loadSession() {

function getAllTaskIds() {
  const ids = new Set();
  if (DATA) DATA.issues.forEach(iss => iss.tasks.forEach(t => ids.add(t.id)));
  return ids;
}

function isChecked(id) { return !!checked[id]; }
function isFP(id) { return !!fpTasks[id]; }
function isResolved(id) { return !!checked[id] || !!fpTasks[id]; }
function setChecked(id, val) {
  if (val) { checked[id] = 1; delete fpTasks[id]; } else { delete checked[id]; }
  saveState();
}
function setFP(id, val) {
  if (val) { fpTasks[id] = 1; delete checked[id]; } else { delete fpTasks[id]; }
  saveState();
}
function toggleFP(tid) {
  var wasFP = isFP(tid);
  var wasChecked = isChecked(tid);
  setFP(tid, !wasFP);
  var ch = [{ tid: tid, field: 'fp', prev: wasFP, next: !wasFP }];
  if (wasChecked && !wasFP) ch.push({ tid: tid, field: 'checked', prev: true, next: false });
  recordAction({ type: 'fp', changes: ch });
  refreshAll();
}
function saveNote(tid, val) {
  val = val.slice(0, 256);
  if (val) remNotes[tid] = val; else delete remNotes[tid];
  saveState();
}

function recordAction(action) {
  if (_skipRecord) return;
  undoStack.push(action);
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack = [];
  updateUndoButtons();
}
function applyChanges(changes, direction) {
  _skipRecord = true;
  changes.forEach(function(c) {
    var val = direction === 'undo' ? c.prev : c.next;
    if (c.field === 'checked') {
      if (val) { checked[c.tid] = 1; delete fpTasks[c.tid]; } else { delete checked[c.tid]; }
    } else if (c.field === 'fp') {
      if (val) { fpTasks[c.tid] = 1; delete checked[c.tid]; } else { delete fpTasks[c.tid]; }
    } else if (c.field === 'note') {
      if (val) remNotes[c.tid] = val; else delete remNotes[c.tid];
    }
  });
  saveState();
  _skipRecord = false;
}
function performUndo() {
  if (!undoStack.length) return;
  _splashShown = false;
  var action = undoStack.pop();
  applyChanges(action.changes, 'undo');
  redoStack.push(action);
  updateUndoButtons();
  refreshAll();
}
function performRedo() {
  if (!redoStack.length) return;
  var action = redoStack.pop();
  applyChanges(action.changes, 'redo');
  undoStack.push(action);
  updateUndoButtons();
  refreshAll();
}
function updateUndoButtons() {
  var u = document.getElementById('undoBtn');
  var r = document.getElementById('redoBtn');
  if (u) u.classList.toggle('disabled', !undoStack.length);
  if (r) r.classList.toggle('disabled', !redoStack.length);
}
function snapshotTask(tid) {
  return { checked: !!checked[tid], fp: !!fpTasks[tid], note: remNotes[tid] || '' };
}
var _noteFocusVal = {};
function noteOnFocus(tid, val) { _noteFocusVal[tid] = val || ''; }
function noteOnBlur(tid, val) {
  val = (val || '').slice(0, 256);
  var prev = _noteFocusVal[tid] || '';
  delete _noteFocusVal[tid];
  if (val !== prev) {
    recordAction({ type: 'note', changes: [{ tid: tid, field: 'note', prev: prev, next: val }] });
  }
  if (val) remNotes[tid] = val; else delete remNotes[tid];
  saveState();
}

  var dataJson = JSON.stringify(DATA, null, 2);
  src = src.replace(/const INITIAL_DATA = \{[\s\S]*?\};/, 'const INITIAL_DATA = ' + dataJson + ';');
  var preIds = Object.keys(checked).filter(function(k) { return checked[k]; });
  var preJson = JSON.stringify(preIds, null, 2);
  src = src.replace(/const PRE_CHECKED = \[[\s\S]*?\];/, 'const PRE_CHECKED = ' + preJson + ';');
  src = src.replace(/const FILE_STAMP = '[^']*';/, "const FILE_STAMP = '" + stamp + "';");
  var curTheme = document.documentElement.getAttribute('data-theme') || '';
  src = src.replace(/const SAVED_THEME = '[^']*';/, "const SAVED_THEME = '" + curTheme + "';");
  src = src.replace(/const SAVED_DATE_STAMP = (true|false);/, 'const SAVED_DATE_STAMP = ' + dateStampSave + ';');
  var blob = new Blob([src], { type: 'text/html' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  var baseName = SCAN_NAME.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-remediation';
  if (dateStampSave) {
    var d = new Date(), ds = '' + d.getFullYear() + ('0'+(d.getMonth()+1)).slice(-2) + ('0'+d.getDate()).slice(-2);
    baseName += '-' + ds;
  }
  a.download = baseName + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  saveDirty = false;
  updateSaveButton();
}

    if (!WORKSTREAM_MAP[key]) WORKSTREAM_MAP[key] = [];
    WORKSTREAM_MAP[key].push(iss);
  });

  if (checkedState && typeof checkedState === 'object') {
    checked = {};
    Object.keys(checkedState).forEach(function(k) {
      if (ALL_TASK_IDS.has(k)) checked[k] = 1;
    });
  } else {
    checked = {};
  }

  if (fpState && typeof fpState === 'object') {
    fpTasks = {};
    Object.keys(fpState).forEach(function(k) {
      if (ALL_TASK_IDS.has(k) && !checked[k]) fpTasks[k] = 1;
    });
  } else {
    fpTasks = {};
  }

  if (notesState && typeof notesState === 'object') {
    remNotes = {};
    Object.keys(notesState).forEach(function(k) {
      if (ALL_TASK_IDS.has(k) && typeof notesState[k] === 'string') remNotes[k] = notesState[k].slice(0, 256);
    });

  saveDirty = false;

}

function esc(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
function formatDetail(s) {
  if (!s) return '';
  var parts = s.split(' | ');
  if (parts.length <= 1) return esc(s);
  var merged = [];
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].trim();
    if (!p) continue;
    if (/^- /.test(p) && p.charAt(p.length - 1) === '\\' && i + 1 < parts.length) {
      merged.push(p + parts[++i].trim());
    } else if (/^CVE-\d{4}-/.test(p)) {
      var cves = [p];
      while (i + 1 < parts.length && /^CVE-\d{4}-/.test(parts[i + 1].trim())) { i++; cves.push(parts[i].trim()); }
      merged.push(cves.join(' '));
    } else {
      merged.push(p);
    }
  }
  var html = '';
  for (var j = 0; j < merged.length; j++) {
    var m = merged[j];
    if (/^-{4,}$/.test(m)) { html += '<hr class="detail-sep">'; continue; }
    if (/^(Current Settings|Recommended Settings \d+|CVEs? Covered|Note):?/i.test(m) || (m.length < 60 && m.charAt(m.length - 1) === ':')) {
      html += '<div class="detail-hdr">' + esc(m) + '</div>';
    } else if (/^- /.test(m) || /^\d+\.\s/.test(m)) {
      html += '<div class="detail-line detail-indent">' + esc(m) + '</div>';
    } else {
      html += '<div class="detail-line">' + esc(m) + '</div>';
    }
  }
  return html;
}
function sevClass(effort) {
  if (effort === 'Low') return 'low';
  if (effort === 'Medium') return 'med';
  return 'high';
}
function sevFromScore(score) {
  if (score >= 9.0) return 'high';
  if (score >= 8.5) return 'med';
  return 'low';
}

function chevronSvg() {
  return '<svg class="group-chevron" viewBox="0 0 20 20" fill="currentColor"><path d="M6.3 7.7a1 1 0 011.4 0L10 10l2.3-2.3a1 1 0 111.4 1.4l-3 3a1 1 0 01-1.4 0l-3-3a1 1 0 010-1.4z"/></svg>';
}
function expandSvg() {
  return '<svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="M9 5a1 1 0 012 0v4h4a1 1 0 010 2h-4v4a1 1 0 01-2 0v-4H5a1 1 0 010-2h4V5z"/></svg>';
}

function renderIssues() {
  const groups = {};
  const order = [];
  DATA.issues.forEach(iss => {
    const ws = iss.workstream;
    if (!groups[ws]) { groups[ws] = []; order.push(ws); }
    groups[ws].push(iss);
  });

  let html = '';
  order.forEach(ws => {
    const issues = groups[ws];
    const allTasks = issues.flatMap(i => i.tasks);
    const matchedIssues = issues.filter(i => matchesSearch(i));
    if (matchedIssues.length === 0) return;

    const total = allTasks.length;
    const done = allTasks.filter(t => isChecked(t.id)).length;
    const fpCount = allTasks.filter(t => isFP(t.id)).length;
    const resolved = done + fpCount;
    const grpId = 'ig-' + ws.replace(/\W+/g, '-');

    html += '<div class="group" id="' + grpId + '" data-ws="' + esc(ws) + '">';
    html += '<div class="group-header" tabindex="0" onclick="toggleGroup(\'' + grpId + '\')" onkeydown="if(event.key===\'Enter\')toggleGroup(\'' + grpId + '\')">';
    html += chevronSvg();
    html += '<span class="group-title">' + esc(ws) + '</span>';
    html += '<span class="group-count" data-gcount="' + grpId + '">' + resolved + '/' + total + (fpCount ? ' · ' + fpCount + ' FP' : '') + '</span>';
    html += '<div class="group-progress"><div class="group-progress-fill" data-gfill="' + grpId + '" style="width:' + (total ? (resolved/total*100) : 0) + '%"></div></div>';
    html += '<div class="group-actions">';
    html += '<button class="group-action" onclick="event.stopPropagation();checkGroup(\'' + grpId + '\',true)">All</button>';
    html += '<button class="group-action" onclick="event.stopPropagation();checkGroup(\'' + grpId + '\',false)">None</button>';
    html += '</div></div>';
    html += '<div class="group-body" data-gbody="' + grpId + '">';

    matchedIssues.forEach(iss => {
      const issDone = iss.tasks.every(t => isChecked(t.id));
      const issAllFP = !issDone && iss.tasks.every(t => isFP(t.id));
      const issAllResolved = iss.tasks.every(t => isResolved(t.id));
      const detailId = 'det-' + iss.pid;
      html += '<div class="issue-card" data-pid="' + iss.pid + '" data-gid="' + grpId + '">';
      html += '<div class="issue-row">';
      html += '<div class="issue-cb"><input type="checkbox" ' + (issDone ? 'checked' : '') +
        ' onchange="toggleIssue(\'' + iss.pid + '\',this.checked)" aria-label="Mark ' + esc(iss.name) + '"></div>';
      html += '<div class="sev-stripe ' + sevFromScore(iss.score) + '"></div>';
      html += '<div class="issue-info">';
      html += '<div class="issue-name' + (issDone ? ' done' : (issAllFP ? ' fp' : '')) + '" data-iname="' + iss.pid + '">' + esc(iss.name) + (issAllFP ? '<span class="fp-tag">FP</span>' : '') + '</div>';
      var hostMap = {};
      iss.tasks.forEach(function(t) {
        if (!hostMap[t.machine]) hostMap[t.machine] = { total: 0, done: 0, fp: 0 };
        hostMap[t.machine].total++;
        if (isChecked(t.id)) hostMap[t.machine].done++;
        else if (isFP(t.id)) hostMap[t.machine].fp++;
      });
      var uniqueHosts = Object.keys(hostMap).length;
      var resolvedHosts = 0, fpHosts = 0;
      Object.keys(hostMap).forEach(function(m) {
        var h = hostMap[m];
        if (h.done + h.fp === h.total) {
          resolvedHosts++;
          if (h.fp === h.total) fpHosts++;
        }
      });
      var remainingHosts = uniqueHosts - resolvedHosts;
      var hostLabel = resolvedHosts > 0
        ? remainingHosts + ' / ' + uniqueHosts + ' host' + (uniqueHosts !== 1 ? 's' : '')
        : uniqueHosts + ' host' + (uniqueHosts !== 1 ? 's' : '');
      html += '<div class="issue-sub">';
      html += '<span>' + hostLabel + '</span>';
      html += '<span>' + esc(iss.family) + '</span>';
      if (iss.estimate) {
        var estText = iss.estimate;
        if (resolvedHosts > 0 && remainingHosts > 0) {
          var frac = remainingHosts / uniqueHosts;
          estText = '~' + iss.estimate.replace(/(\d+(?:\.\d+)?)/g, function(n) {
            var s = Math.ceil(parseFloat(n) * frac); return s < 1 ? 1 : s;
          });
        } else if (remainingHosts === 0) {
          estText = null;
        }
        if (estText) html += '<span>' + esc(estText) + '</span>';

function matchesSearch(iss) {
  if (!showCompleted && iss.tasks.every(t => isResolved(t.id))) return false;
  if (!searchTerm) return true;
  const q = searchTerm.toLowerCase();
  if (iss.name.toLowerCase().includes(q)) return true;
  if (iss.pid.includes(q)) return true;
  if (iss.family.toLowerCase().includes(q)) return true;
  if (iss.cves.some(c => c.toLowerCase().includes(q))) return true;
  if (iss.tasks.some(t => {
    const m = DATA.machines.find(mm => mm.slug === t.machine);
    return m && (m.ips.some(ip => ip.includes(q)) || (m.name && m.name.toLowerCase().includes(q)));
  })) return true;
  return false;
}
function matchesSearchMachine(m) {
  if (!showCompleted && m.tasks.every(t => isResolved(t))) return false;
  if (!searchTerm) return true;
  const q = searchTerm.toLowerCase();
  if (m.ips.some(ip => ip.includes(q))) return true;
  if (m.name && m.name.toLowerCase().includes(q)) return true;
  if (m.os.toLowerCase().includes(q)) return true;
  if (m.subnet.includes(q)) return true;
  if (m.tasks.some(tid => {
    const issSlug = tid.split('::')[0];
    const iss = DATA.issues.find(i => i.slug === issSlug);
    return iss && iss.name.toLowerCase().includes(q);
  })) return true;
  return false;
}

function navGoBack() {

}
function launchConfetti() {
  var c = document.getElementById('confettiCanvas');
  c.width = window.innerWidth;
  c.height = window.innerHeight;
  var ctx = c.getContext('2d');
  var colors = ['#D5A754','#2D3E52','#e0b65e','#4a6fa5','#fff','#f0c674','#3d7cb7'];
  var pieces = [];
  for (var i = 0; i < 150; i++) {
    pieces.push({
      x: Math.random() * c.width,
      y: Math.random() * c.height * -1 - 20,
      w: 4 + Math.random() * 6,
      h: 8 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * Math.PI * 2,
      rv: (Math.random() - 0.5) * 0.15,
      opacity: 0.8 + Math.random() * 0.2
    });
  }
  var frame = 0;
  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    var alive = false;
    pieces.forEach(function(p) {
      if (p.y > c.height + 20) return;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.04;
      p.rot += p.rv;
      p.vx *= 0.999;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.opacity * Math.max(0, 1 - p.y / (c.height * 1.2));
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (alive && frame < 400) requestAnimationFrame(draw);
  }
  draw();
}

function updateHeaderMeta() {
  const m = DATA.meta;
  const totalIssues = DATA.issues.length;
  const totalMachines = DATA.machines.length;
  const totalTasks = DATA.issues.reduce((sum, iss) => sum + iss.tasks.length, 0);
  document.getElementById('headerTitle').textContent = SCAN_NAME + ' Remediation Tracker';
  document.title = SCAN_NAME + ' Remediation Tracker';
  var resolved = 0;
  ALL_TASK_IDS.forEach(function(id) { if (isResolved(id)) resolved++; });
  var hasWork = resolved > 0;
  var remIssues = 0, remMachines = 0, remTasks = 0;
  var effortLow = 0, effortMed = 0, effortHigh = 0;
  if (hasWork) {
    DATA.issues.forEach(function(iss) {
      var issRem = iss.tasks.filter(function(t) { return !isResolved(t.id); }).length;
      if (issRem > 0) remIssues++;
      remTasks += issRem;
      var e = (iss.effort || 'Medium').toLowerCase();
      if (e === 'low') effortLow += issRem;
      else if (e === 'high') effortHigh += issRem;
      else effortMed += issRem;
    });
    var machSeen = {};
    DATA.issues.forEach(function(iss) {
      iss.tasks.forEach(function(t) {
        if (!isResolved(t.id) && !machSeen[t.machine]) { machSeen[t.machine] = 1; remMachines++; }
      });
    });
  } else {
    DATA.issues.forEach(function(iss) {
      var e = (iss.effort || 'Medium').toLowerCase();
      if (e === 'low') effortLow += iss.tasks.length;
      else if (e === 'high') effortHigh += iss.tasks.length;
      else effortMed += iss.tasks.length;
    });
  }
  var issLabel = hasWork ? remIssues + ' / ' + totalIssues + ' issues' : totalIssues + ' issues';
  var machLabel = hasWork ? remMachines + ' / ' + totalMachines + ' machines' : totalMachines + ' machines';
  var taskLabel = hasWork ? remTasks + ' / ' + totalTasks + ' tasks' : totalTasks + ' tasks';
  document.getElementById('headerMeta').innerHTML =
    '<span>Scan: ' + esc(m.scan_date) + '</span>' +
    '<span>' + issLabel + '</span>' +
    '<span>' + machLabel + '</span>' +
    '<span>' + taskLabel + '</span>' +
    '(Task Effort: <span class="eff-low">' + effortLow + ' Low</span>' +
    '<span class="eff-med">' + effortMed + ' Medium</span>' +
    '<span class="eff-high">' + effortHigh + ' High</span>)';
}

function refreshAll() {
  if (!DATA) return;
  renderIssues();
  renderMachines();
  updateGlobalProgress();
  updateHeaderMeta();
}

// --- Startup ---
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    searchTerm = this.value.trim();
    if (DATA) refreshAll();
  }, 200);
});

function loadFromEmbedded() {
  var clean = sanitizeData(INITIAL_DATA);
  var preState = null;
  if (PRE_CHECKED && PRE_CHECKED.length) {
    preState = {};
    PRE_CHECKED.forEach(function(id) { preState[id] = 1; });
  }
  initWithData(clean, preState);
  saveSession();
}

(function startup() {
  SCAN_NAME = INITIAL_DATA.meta && INITIAL_DATA.meta.scan || 'Untitled';
  var session = loadSession();
  if (session && FILE_STAMP && session.fileStamp === FILE_STAMP) {
    try {
      var clean = sanitizeData(session.data);
      var cleanChecked = session.checked ? sanitizeChecked(session.checked) : null;
      var cleanFP = session.fpTasks ? sanitizeChecked(session.fpTasks) : null;
      initWithData(clean, cleanChecked, cleanFP, session.remNotes || null);
    } catch(e) {
      loadFromEmbedded();
    }
  } else {
    loadFromEmbedded();
  }
})();

function toggleSettingsModal() {
  var m = document.getElementById('settingsModal');
  m.classList.toggle('hidden');
  if (!m.classList.contains('hidden')) {
    syncThemePills();
    syncDateStampPills();
    document.getElementById('schemaLabel').textContent = COMPATIBLE_SCHEMA_VERSIONS.join(', ');
  }
}
function closeSettingsModal() {
  document.getElementById('settingsModal').classList.add('hidden');
}
function syncThemePills() {
  var current = document.documentElement.getAttribute('data-theme') || 'system';
  document.querySelectorAll('.theme-pill').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-theme-val') === current);
  });
}
function setTheme(val) {
  if (val === 'system') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', val);
  }
  try { localStorage.setItem('secureit-rem-theme', val); } catch(e) {}
  syncThemePills();
}
function syncDateStampPills() {
  document.querySelectorAll('[data-datestamp-val]').forEach(function(b) {
    b.classList.toggle('active', (b.getAttribute('data-datestamp-val') === 'on') === dateStampSave);
  });
}
function setDateStamp(val) {
  dateStampSave = !!val;
  try { localStorage.setItem('secureit-rem-datestamp', val ? '1' : '0'); } catch(e) {}
  syncDateStampPills();
}
(function() {
  if (SAVED_THEME === 'light' || SAVED_THEME === 'dark') {
    document.documentElement.setAttribute('data-theme', SAVED_THEME);
  } else {
    try {
      var saved = localStorage.getItem('secureit-rem-theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch(e) {}
  }
})();
</script>
